name: Output Demo

on: push

jobs:
  job1:
    runs-on: windows-latest

    steps:
      - name: Step One
        id: step1
        shell: bash
        run: echo "version=0.0.1" >> $GITHUB_OUTPUT

      - name: Step Two
        shell: bash
        run: echo "This version is ${{ steps.step1.outputs.version }}"
