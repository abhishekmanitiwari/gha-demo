name: if-with-function

on:
  push:
    branches:
      - main
      - dev
      - prod

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: This is dev branch step
        if: ${{ startsWith(github.ref_name, 'de') && github.event_name == 'push' }}
        run: echo "Deployment the code for development ${{ github.ref_name }}"

  deploye-job:
    runs-on: ubuntu-latest
    steps:
      - name: This is prod deploy step
        if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
        run: echo "Deployment the code for Production ${{ github.ref_name }}"

  notify-success:
    name: Notify on Successful Deployment
    runs-on: ubuntu-latest
    needs: [quality-checks, deploye-job]
    steps:
      - name: Send success notification
        if: ${{ always() && !failure() }}
        run: |
          echo "✅ Deployment completed successfully"
          echo "Branch: ${{ github.ref_name }}"

  notify-failure:
    name: Notify on Deployment Failure
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        if: ${{ failure() }}
        run: |
          echo "❌ Deployment failed"
          echo "Branch: ${{ github.ref_name }}"
